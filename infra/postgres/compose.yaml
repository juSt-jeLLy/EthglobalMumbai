services:
  postgres:
    image: postgres:16-alpine
    container_name: plan-b-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plan_b}
      POSTGRES_USER: ${POSTGRES_USER:-plan_b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/postgres/.env}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - plan_b_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  plan_b_postgres_data:
